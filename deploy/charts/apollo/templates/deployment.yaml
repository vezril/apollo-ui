apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apollo-ui.fullname" . }}
  labels:
    {{- include "apollo-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apollo-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apollo-ui.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apollo-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: NEXT_PUBLIC_APOLLO_API_BASE
              value: {{ .Values.apollo.apiBase | quote }}
            - name: APOLLO_ENDPOINT
              value: {{ .Values.apollo.endpoint | quote }}
            {{- if .Values.apollo.token.secretName }}
            - name: APOLLO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apollo.token.secretName }}
                  key: {{ .Values.apollo.token.secretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/apollo/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/apollo/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
